name: Retire legacy advertising service
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retire-legacy-ad-service.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-advertising-host
  cancel-in-progress: false
jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      MAIN_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Pause only the retired advertising project
        run: |
          node --input-type=module <<'NODE'
          const name = 'smart-jsa-bridge-ads-6179717';
          const { VERCEL_TOKEN: token, VERCEL_ORG_ID: teamId, MAIN_PROJECT_ID: mainId } = process.env;
          if (!token || !teamId || !mainId) throw Error('Deployment credentials missing');
          const headers = { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' };
          const query = new URLSearchParams({ teamId });
          const api = (path, method = 'GET') => fetch('https://api.vercel.com' + path + '?' + query, {
            method, headers, signal: AbortSignal.timeout(20000),
          });
          const lookup = await api('/v9/projects/' + name);
          if (lookup.status === 404) { console.log('Retired project is absent.'); process.exit(0); }
          if (!lookup.ok) throw Error('Project lookup failed: ' + lookup.status);
          const project = await lookup.json();
          if (project.name !== name || !project.id || project.id === mainId || project.accountId !== teamId)
            throw Error('Project identity did not match the isolated advertising service');
          const result = await api('/v1/projects/' + encodeURIComponent(project.id) + '/pause', 'POST');
          if (!result.ok) throw Error('Project pause failed: ' + result.status);
          for (let attempt = 0; attempt < 12; attempt++) {
            const response = await fetch('https://' + name + '.vercel.app/', {
              cache: 'no-store', signal: AbortSignal.timeout(10000),
            });
            const body = await response.text();
            if (response.status === 503 && body.includes('DEPLOYMENT_PAUSED')) {
              console.log('Retired advertising service is paused; production requests are blocked.');
              process.exit(0);
            }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw Error('Pause was accepted but public blocking is not yet confirmed');
          NODE
