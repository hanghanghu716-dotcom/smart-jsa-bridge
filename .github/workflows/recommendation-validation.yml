name: Recommendation and locale validation

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'python/**'
      - 'data/recommendation-knowledge/**'
      - '.github/workflows/recommendation-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recommendation-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-data-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read public recommendation data without changing the database
        run: node scripts/audit-public-recommendations.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recommendation-public-data-audit
          path: artifacts/recommendations/public-data-audit.json
          retention-days: 14
  recommendations:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: true
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Restore rendering fonts
        id: fonts-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/build-fonts
          key: fonts-ubuntu24-v1-${{ runner.arch }}-${{ hashFiles('scripts/setup-rendering.sh') }}
      - name: Prepare Chrome and cached fonts
        run: bash scripts/setup-rendering.sh
      - name: Save verified fonts for retries
        if: steps.fonts-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/build-fonts
          key: ${{ steps.fonts-cache.outputs.cache-primary-key }}
      - name: Install PDF inspection tools
        run: |
          if ! command -v pdfinfo >/dev/null || ! command -v pdftoppm >/dev/null; then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends poppler-utils
          fi

      - name: Verify recommendation and locale logic
        run: node --test --test-concurrency=1 scripts/analysis-*.test.js scripts/recommendation-*.test.js
      - name: Verify knowledge coverage matches the authored input files
        run: node scripts/recommendation-coverage.js --check docs/recommendation-task-coverage.json
      - name: Verify guidance source bindings
        run: |
          node scripts/recommendation-guidance-sources.js --check data/recommendation-knowledge/regional-drafts.json data/recommendation-knowledge/guidance-source-captures.json
          node scripts/recommendation-guidance-sources.js --check data/recommendation-knowledge/pressure-welding-drafts.json data/recommendation-knowledge/guidance-source-captures.json
      - name: Verify offline mapping safeguards
        run: python -m unittest discover -s python -p 'test_*.py'
      - name: Verify isolated browser recommendation flow
        run: node scripts/analysis-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recommendation-validation
          path: artifacts/recommendations/
          retention-days: 14
