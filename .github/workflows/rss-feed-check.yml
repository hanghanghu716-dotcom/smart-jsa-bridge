name: Bounded RSS read checks
on:
  push:
    branches: [codex/rss-feed-deadline]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test scripts/rss-content.test.js scripts/live-content.test.js
      - run: node scripts/rss-live-probe.js
      - run: python3 scripts/verify-live-rss.py --candidate
