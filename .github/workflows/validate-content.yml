name: Validate content publishing

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PUPPETEER_SKIP_DOWNLOAD: true
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
      JSA_PRERENDER_CONCURRENCY: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Restore rendering fonts
        id: fonts-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/build-fonts
          key: fonts-ubuntu24-v1-${{ runner.arch }}-${{ hashFiles('scripts/setup-rendering.sh') }}
      - name: Prepare Chrome and cached fonts
        run: bash scripts/setup-rendering.sh
      - name: Save verified fonts for retries
        if: steps.fonts-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/build-fonts
          key: ${{ steps.fonts-cache.outputs.cache-primary-key }}
      - name: Restore generated HTML and PDF
        id: render-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/rendered-content
          key: rendered-ubuntu24-v1-${{ runner.arch }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            rendered-ubuntu24-v1-${{ runner.arch }}-
      - name: Verify content and locale logic
        run: npm run test:all
      - name: Verify isolated work-package and moderation access controls
        run: |
          npm install --prefix "$RUNNER_TEMP/work-db" --no-save --ignore-scripts @electric-sql/pglite@0.5.8
          export PGLITE_MODULE="$RUNNER_TEMP/work-db/node_modules/@electric-sql/pglite"
          node scripts/work-packages-db.cjs
          node scripts/author-moderation-db.cjs
          node scripts/security-operations-db.cjs
      - name: Build frontend and verify isolated navigation and document previews
        run: |
          npx vite build
          node scripts/explore-quality-browser.cjs
          node scripts/explore-view-browser.cjs
          node scripts/library-discovery-browser.cjs
          node scripts/public-document-preview-browser.cjs
      - name: Render and verify static HTML, PDF and live-content templates
        run: npm run build
      - name: Save verified HTML and PDF for retries
        uses: actions/cache/save@v4
        with:
          path: .cache/rendered-content
          key: ${{ steps.render-cache.outputs.cache-primary-key }}
      - name: Verify operator documents against public data
        run: node scripts/verify-operator-documents.cjs --local
      - name: Verify complete RSS bodies against public content
        run: |
          node scripts/render-rss-check.js
          python3 scripts/verify-live-rss.py --candidate
