name: Validate content publishing

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
      JSA_PRERENDER_CONCURRENCY: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Chrome system dependencies
        run: sudo apt-get update && sudo apt-get install -y libnss3 libnspr4 libgbm-dev libasound2t64
      - name: Verify content and locale logic
        run: npm run test:locales && npm run test:site && npm run test:content && npm run test:theme && npm run test:analysis && npm run test:document && npm run test:persistence && npm run test:public
      - name: Render and verify every current case-study URL
        run: npm run build
