name: Sync search performance
on:
  schedule:
    - cron: '23 20 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: Import the available history for the last 12 months
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: search-console-sync
  cancel-in-progress: false
jobs:
  sync:
    if: vars.SEARCH_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify collector
        run: node --test scripts/search-console-collector.test.js
      - name: Collect aggregate search metrics
        env:
          SUPABASE_URL: https://aajvezmhyrdawxxbulqz.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SEARCH_METRICS_INGEST_TOKEN: ${{ secrets.SEARCH_METRICS_INGEST_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SEARCH_CONSOLE_PROPERTY: ${{ vars.GOOGLE_SEARCH_CONSOLE_PROPERTY }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          BING_SITE_URL: https://smartjsabridge.com/
          BACKFILL: ${{ inputs.backfill }}
        run: |
          if [ "$BACKFILL" = "true" ]; then
            node scripts/sync-search-console.js --backfill
          else
            node scripts/sync-search-console.js
          fi
