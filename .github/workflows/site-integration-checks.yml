name: Site integration checks
on:
  pull_request:
    paths:
      - 'src/**'
      - 'api/**'
      - 'vercel.json'
      - '.github/workflows/site-integration-checks.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:all
      - run: npx vite build
      - run: node scripts/regional-guidance-browser.cjs
