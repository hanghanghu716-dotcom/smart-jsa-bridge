name: Validate Free storage concurrency
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storage-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: quota_test_password
          POSTGRES_DB: quota_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: quota_test_password
      PGDATABASE: quota_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify concurrent third and fourth saves against real PostgreSQL sessions
        run: node scripts/quota-concurrency.cjs
