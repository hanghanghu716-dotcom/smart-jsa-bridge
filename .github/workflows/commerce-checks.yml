name: Commerce checks
on:
  pull_request:
    paths:
      - 'api/commerce.js'
      - 'server/commerce/**'
      - 'src/components/CommerceRecommendations*'
      - 'src/locales/commerceUi.js'
      - 'src/pages/CaseStudyDetail.jsx'
      - 'src/pages/PublicJsa.jsx'
      - 'scripts/commerce*'
      - 'data/commerce/**'
      - '.github/workflows/commerce-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: commerce-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/commerce.test.js
      - run: npx vite build
