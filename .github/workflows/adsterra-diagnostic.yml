name: Adsterra loading diagnostic
on:
  pull_request:
    paths: ['.github/workflows/adsterra-diagnostic.yml', 'scripts/adsterra-diagnostic.cjs']
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/adsterra-diagnostic.cjs
