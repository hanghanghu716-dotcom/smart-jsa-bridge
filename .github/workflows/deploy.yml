name: Vercel Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-content-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
      JSA_PRERENDER_CONCURRENCY: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chrome system dependencies
        run: sudo apt-get update && sudo apt-get install -y libnss3 libnspr4 libgbm-dev libasound2t64 fonts-noto-cjk fonts-noto-core
      - name: Verify content and locale logic
        run: npm run test:all
      - name: Load Vercel project configuration
        run: npx --yes vercel@59.23.2 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build current database content and verify initial HTML
        run: npx --yes vercel@59.23.2 build --prod --token="$VERCEL_TOKEN"
      - name: Deploy the verified build without rebuilding
        run: npx --yes vercel@59.23.2 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: Verify production HTML and every localized PDF
        run: node scripts/verify-live-release.js dist/assets/guides/manifest.json
