name: Vercel Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-content-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PUPPETEER_SKIP_DOWNLOAD: true
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
      JSA_PRERENDER_CONCURRENCY: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Restore rendering fonts
        uses: actions/cache@v4
        with:
          path: .cache/build-fonts
          key: fonts-ubuntu24-v1-${{ runner.arch }}-${{ hashFiles('scripts/setup-rendering.sh') }}
      - name: Prepare Chrome and cached fonts
        run: bash scripts/setup-rendering.sh
      - name: Restore generated HTML and PDF
        uses: actions/cache@v4
        with:
          path: .cache/rendered-content
          key: rendered-ubuntu24-v1-${{ runner.arch }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            rendered-ubuntu24-v1-${{ runner.arch }}-
      - name: Verify content and locale logic
        run: npm run test:all
      - name: Load Vercel project configuration
        run: npx --yes vercel@59.23.2 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build and verify incremental HTML and PDF
        run: npx --yes vercel@59.23.2 build --prod --token="$VERCEL_TOKEN"
      - name: Verify isolated library loading and original-document editing
        # Remote requests are intercepted; this fixture performs no real writes.
        run: |
          node scripts/library-discovery-browser.cjs
          node scripts/public-document-preview-browser.cjs
          node scripts/regional-guidance-browser.cjs
      - name: Record the current production deployment for recovery
        run: node scripts/production-recovery.js capture
      - name: Deploy the verified build without rebuilding
        id: publish
        run: npx --yes vercel@59.23.2 deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN" > .cache/deployment-url.txt
      # Rollback disables automatic domain assignment. Explicitly promote this
      # exact staged build so a retry cannot validate the previous release by
      # mistake, and normal auto-assignment cannot make promote fail with 409.
      - name: Promote the verified build and restore production domain assignment
        run: npx --yes vercel@59.23.2 promote "$(cat .cache/deployment-url.txt)" --yes --scope "$VERCEL_ORG_ID"
      - name: Verify live content discovery and article delivery
        run: |
          node scripts/verify-security-release.js
          node scripts/verify-live-content.js
          node scripts/verify-live-exclusions.js
          python3 scripts/verify-live-rss.py
      - name: Verify operator filter, document previews and PDF downloads
        run: node scripts/verify-operator-documents.cjs
      - name: Verify production HTML and every localized PDF
        run: node scripts/verify-live-release.js dist/assets/guides/manifest.json
      - name: Restore the previous deployment when release verification fails
        if: failure() && steps.publish.outcome == 'success'
        run: node scripts/production-recovery.js rollback
      - name: Preserve failed release comparison evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-check-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true
          path: |
            dist/assets/guides/manifest.json
            .vercel/output/static/assets/guides/manifest.json
            .cache/live-release-check.json
            .cache/production-recovery.json
            .cache/deployment-url.txt
